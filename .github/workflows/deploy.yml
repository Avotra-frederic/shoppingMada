name: Backend image and VPS deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate image namespace
        env:
          GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE }}
        run: test -n "$GHCR_NAMESPACE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ vars.GHCR_NAMESPACE }}/shopinmada-backend:latest
            ghcr.io/${{ vars.GHCR_NAMESPACE }}/shopinmada-backend:${{ github.sha }}

      - name: Deploy backend on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          script: |
            set -eu
            cd /opt/shopinmada
            export BACKEND_TAG=${{ github.sha }}
            flock -w 300 /tmp/shopinmada-deploy.lock sh -c '
              set -eu
              docker compose pull backend
              docker compose up -d --no-build backend
              route_status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --retry 20 --retry-connrefused --retry-delay 2 http://127.0.0.1:5100/api/v1/marketplace/orders/payment-methods/not-an-object)
              if [ "$route_status" != "400" ]; then
                echo "Marketplace route smoke test failed with HTTP $route_status"
                exit 1
              fi
            '
